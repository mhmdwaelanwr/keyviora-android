name: KEYVIORA — Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build:
    name: Compile, lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Kotlin/Android compilation
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Android lint report
        if: success()
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KEYVIORA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEYVIORA-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  emulator-smoke:
    name: Android 15 emulator — launch smoke test
    runs-on: ubuntu-latest
    needs: android-build
    timeout-minutes: 30
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Download compiled debug APK
        uses: actions/download-artifact@v4
        with:
          name: KEYVIORA-debug-APK
          path: artifacts
      - name: Boot Android emulator and launch KEYVIORA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell am start -W -n com.mhmdwaelanwr.keyviora/.MainActivity
            sleep 7
            adb shell pidof com.mhmdwaelanwr.keyviora
